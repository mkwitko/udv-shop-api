# Tuning para Ampere A1: 4 OCPU, 24GB de RAM, disco SSD (block volume).
# Aplicado via include no postgresql.conf gerado pelo initdb (ver initdb/00-include-tuning.sh).
# Editar aqui + reiniciar o container basta; não precisa recriar o cluster.

# --- memória ---
# ~25% da RAM que o Postgres pode usar, deixando folga para a API e o SO no mesmo host
shared_buffers = 2GB
# dica ao planner sobre o cache do SO; não aloca nada
effective_cache_size = 6GB
# por operação de sort/hash, não por conexão: 50 conexões com alguns nós ainda cabe
work_mem = 16MB
maintenance_work_mem = 512MB

# --- conexões ---
# pool da API é 10; sobra folga para dump, ensaio de restore e psql de emergência
max_connections = 50

# --- WAL e checkpoint ---
max_wal_size = 2GB
min_wal_size = 512MB
# ARM tem CPU sobrando e o gargalo é disco
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- planner: é SSD, não disco rotacional ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- observabilidade: sem isto não há como saber qual query dói ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '

# --- autovacuum: Order, Payment e Donation são as tabelas quentes ---
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# --- fuso: o banco guarda UTC, o app formata ---
timezone = 'UTC'
log_timezone = 'UTC'
