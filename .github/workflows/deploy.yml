name: Deploy

# Build da imagem -> GHCR -> SSH na VM: compose pull && up -d.
# Secrets necessários no repo:
#   DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY (chave privada),
#   DEPLOY_PATH (ex.: /opt/udv-shop-api),
#   PROD_ENV_B64 (o .env de produção inteiro, em base64 — ambiente `production`)
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    # A VM é Ampere A1 (arm64). Repo público: definir a variável ARM_RUNNER=ubuntu-24.04-arm
    # e o build sai nativo (~4min). Repo privado sem plano pago: não definir nada — cai no
    # runner x86 com QEMU (~20min), que funciona igual, só devagar.
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: QEMU (só quando o runner não é arm64)
        if: ${{ !vars.ARM_RUNNER }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Sem este passo, mudança em script, compose ou tuning do banco nunca chega na VM.
      - name: manda compose, scripts e deploy/ para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/*,deploy/**"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
      # O .env de produção mora no secret PROD_ENV_B64 (ambiente `production`), não no
      # repositório: commitar chave de pagamento deixa o segredo no histórico para sempre,
      # e rotacionar depois não apaga o que já foi clonado. Base64 para o conteúdo chegar
      # byte a byte, sem o shell comer aspas, cifrão ou quebra de linha.
      - name: escreve o .env de produção na VM
        uses: appleboy/ssh-action@v1
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PROD_ENV_B64
          script: |
            set -euo pipefail
            umask 077
            cd ${{ secrets.DEPLOY_PATH }}
            if [ -z "${PROD_ENV_B64:-}" ]; then
              echo "PROD_ENV_B64 vazio: mantendo o .env que já está na VM" >&2
              exit 0
            fi
            printf '%s' "$PROD_ENV_B64" | base64 -d > .env.novo
            # Sanidade antes de trocar: .env truncado derruba a API inteira, e a senha do
            # Postgres precisa continuar sendo a do cluster que já foi inicializado.
            for chave in DATABASE_URL POSTGRES_PASSWORD JWT_PUBLIC_KEY_B64; do
              grep -qE "^${chave}=." .env.novo || { echo "faltou ${chave} no PROD_ENV_B64" >&2; exit 1; }
            done
            if [ -f .env ]; then
              anterior=$(grep -E '^POSTGRES_PASSWORD=' .env || true)
              novo=$(grep -E '^POSTGRES_PASSWORD=' .env.novo || true)
              [ "$anterior" = "$novo" ] || {
                echo "POSTGRES_PASSWORD mudou: o cluster já inicializado não aceita a nova senha" >&2
                exit 1
              }
              cp -a .env .env.anterior
            fi
            mv .env.novo .env
            chmod 600 .env

      - name: troca a imagem, com dump antes e volta se falhar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x scripts/*.sh
            ./scripts/deploy-image.sh '${{ needs.image.outputs.image }}'
