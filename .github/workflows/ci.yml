name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Mesma imagem e mesmo locale da produção: divergir aqui é ter teste que mente.
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: udv
          POSTGRES_PASSWORD: udv
          POSTGRES_DB: udvshop_test
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pt-BR --encoding=UTF8 --locale=C.UTF-8"
        ports:
          # .env.test aponta para 5434
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U udv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm db:generate
      - run: pnpm typecheck
      - name: migrations no banco de teste
        run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://udv:udv@localhost:5434/udvshop_test
      - run: pnpm test
      - run: pnpm build
      # O CMD da imagem roda `node dist/server.js`. Com o tsconfig de typecheck (que inclui
      # test/ e scripts/) o tsc emitia dist/src/server.js e o container reiniciava em loop
      # com MODULE_NOT_FOUND — em produção, não no CI.
      - name: build emite dist/server.js e não carrega testes
        run: |
          test -f dist/server.js || { echo "dist/server.js não existe"; ls -R dist | head -30; exit 1; }
          test ! -d dist/test || { echo "dist/test entrou no build de produção"; exit 1; }

  # Infra de banco e de deploy tem teste próprio: cluster que nasce errado e compose que não
  # sobe são defeitos que só aparecem na VM, e lá é caro.
  db-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck nos scripts de host
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # severity=warning: os avisos de nível info incluem SC2329 ("função nunca chamada")
          # para função que só o trap invoca, o que é falso positivo aqui.
          shellcheck --severity=warning scripts/*.sh scripts/test/*.sh deploy/postgres/initdb/*.sh
      - name: parser de .env aguenta valor com < > | e espaço
        run: ./scripts/test/load-env-check.sh
      - name: cluster nasce com ICU, tuning e roles corretos
        run: ./scripts/test/db-bootstrap-check.sh
      - name: composes válidos e sem porta publicada em produção
        run: ./scripts/test/compose-check.sh
