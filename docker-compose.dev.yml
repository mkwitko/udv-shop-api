services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: udv
      POSTGRES_PASSWORD: udv
      POSTGRES_DB: udvshop
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: udv
      POSTGRES_PASSWORD: udv
      POSTGRES_DB: udvshop_test
    ports: ["5434:5432"]
volumes:
  pgdata:
